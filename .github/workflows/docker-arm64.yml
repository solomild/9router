name: Build Docker Image (arm64)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}-arm64
            type=raw,value=0.5.81-arm64
            type=raw,value=arm64
            type=ref,event=branch,suffix=-arm64

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-arm64
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-arm64,mode=max
          platforms: linux/arm64
          provenance: false
          sbom: false
